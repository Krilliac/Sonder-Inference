name: self-hosted

# Build and test on the owner's self-hosted runners (labels sonder-win and
# sonder-linux), which are much faster than the shared hosted queue. A green run
# here is what the merge train requires before it merges with the admin bypass.
# The hosted ci.yml checks keep running as before.
#
# Security: these runners are persistent and run as the owner's account on the
# owner's own machines, and this repository is public, so they must only ever run
# code the owner put there. Every job's `if:` admits a run only when the owner
# triggered it (github.actor and github.triggering_actor, so a re-run by anyone
# else is refused too) and it is either a manual dispatch or a same-repository
# pull request that the owner opened. Bot PRs (Dependabot), bot pushes and PRs
# from other accounts in this repository get only the hosted ci.yml checks.
#
# This `if:` is NOT a boundary against code that can edit .github/workflows/. A
# run uses the workflow files at the event's commit, so a fork PR (or any app
# with workflows write) can drop this condition or add its own `runs-on:
# self-hosted` job. The only barrier against forks is the repository Actions
# setting that requires approval for every outside contributor's run. Never
# approve a fork's workflow run without reading every .github/workflows/ change
# in it. Accepted residual risks: a compromised owner account; an owner-approved
# fork run; and an owner action (push, update-branch, reopen, dispatch) on a
# branch someone else has pushed to, which runs that branch's current code.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: self-hosted-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# These runners share the owner's workstation (31 GB RAM, with WSL capped at about
# 15 GB) with its interactive work and local builds. An uncapped Ninja build
# (nproc + 2 = 26 jobs) thrashed the WSL VM on 2026-11-27, so parallelism is capped.
# Timing-sensitive tests (loopback mocks, tuner timeouts) can miss a deadline when
# both repositories' jobs share the box, so a failed test is retried up to twice
# here. The hosted ci.yml runs every test once with no retry, and the merge train
# still parks a PR on any failed hosted check, so a real flake stays visible.
env:
  CMAKE_BUILD_PARALLEL_LEVEL: "4"
  CTEST_PARALLEL_LEVEL: "4"

jobs:
  windows:
    name: self-hosted windows
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == github.repository_owner))
    runs-on: [self-hosted, sonder-win]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset ci-windows

      - name: Build
        run: cmake --build --preset ci-windows

      - name: Test
        run: ctest --preset ci-windows --repeat until-pass:3

  linux:
    name: self-hosted linux
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == github.repository_owner))
    runs-on: [self-hosted, sonder-linux]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure
        run: cmake --preset ci-linux

      - name: Build
        run: cmake --build --preset ci-linux

      - name: Test
        run: ctest --preset ci-linux --repeat until-pass:3
