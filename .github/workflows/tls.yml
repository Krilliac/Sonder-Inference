name: tls

# TLS-ON lanes for the optional https:// transport (src/net/tls*, owner:
# feat/tls). The default ci.yml jobs keep building with TLS OFF and need no
# OpenSSL. See docs/integration/tls.md.
#
# Until root CMakeLists.txt has include(SonderTls), the configure steps inject
# it with CMAKE_PROJECT_SonderInference_INCLUDE=cmake/SonderTlsDeferred.cmake.
# That helper is a no-op once the root include exists (include_guard), so these
# jobs work either way. Each job fails if the sonder.tls.* tests are missing.
#
# No job contacts a remote host: the TLS tests use an in-process server on
# 127.0.0.1 with a PKI generated at test time.

on:
  push:
    branches: [main, 'feat/tls*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tls-linux:
    name: tls-linux (ubuntu-latest, OpenSSL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja + OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev

      - name: Configure (TLS ON, OpenSSL)
        run: >
          cmake --preset ci-linux -DSONDER_WITH_TLS=ON -DSONDER_TLS_BACKEND=openssl
          "-DCMAKE_PROJECT_SonderInference_INCLUDE=${{ github.workspace }}/cmake/SonderTlsDeferred.cmake"

      - name: Build
        run: cmake --build --preset ci-linux

      - name: TLS tests are registered
        run: |
          n=$(ctest --preset ci-linux -N | grep -c 'sonder\.tls\.' || true)
          echo "sonder.tls.* tests: $n"
          test "$n" -ge 14

      - name: Test (full suite)
        run: ctest --preset ci-linux

      - name: TLS tests, repeated
        run: ctest --preset ci-linux -R 'sonder\.tls\.' --repeat until-fail:3

  tls-windows:
    name: tls-windows (windows-latest, MSVC, Schannel)
    runs-on: windows-latest
    # Temporary while the MSVC/Schannel lane is new; removed once it is green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ensure Ninja
        shell: pwsh
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }

      # The library uses Schannel (OS). OpenSSL is only for the in-test TLS
      # server and test-time certificate generation in tests/tls.
      - name: OpenSSL for the in-test TLS server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @('C:\Program Files\OpenSSL', 'C:\Program Files\OpenSSL-Win64')
          function Find-OpenSsl {
            $candidates | Where-Object { Test-Path (Join-Path $_ 'include\openssl\ssl.h') } | Select-Object -First 1
          }
          $root = Find-OpenSsl
          if (-not $root) {
            choco install openssl -y --no-progress
            $root = Find-OpenSsl
          }
          if (-not $root) { throw 'OpenSSL (with headers) not found' }
          Write-Host "OpenSSL root: $root"
          & (Join-Path $root 'bin\openssl.exe') version
          "OPENSSL_ROOT_DIR=$($root -replace '\\','/')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Join-Path $root 'bin') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Configure (TLS ON, Schannel)
        shell: pwsh
        run: >
          cmake --preset ci-windows -DSONDER_WITH_TLS=ON -DSONDER_TLS_BACKEND=schannel
          "-DOPENSSL_ROOT_DIR=$env:OPENSSL_ROOT_DIR"
          "-DCMAKE_PROJECT_SonderInference_INCLUDE=${{ github.workspace }}/cmake/SonderTlsDeferred.cmake"

      - name: Build (/W4 /WX)
        run: cmake --build --preset ci-windows

      - name: Library does not link OpenSSL
        shell: pwsh
        run: |
          $deps = dumpbin /dependents build\ci-windows\sonder-infer.exe | Out-String
          Write-Host $deps
          if ($deps -match 'libssl|libcrypto') { throw 'sonder-infer.exe imports OpenSSL; the Schannel build must not' }

      - name: TLS tests are registered
        shell: pwsh
        run: |
          $n = (ctest --preset ci-windows -N | Select-String 'sonder\.tls\.').Count
          Write-Host "sonder.tls.* tests: $n"
          if ($n -lt 14) { throw "expected >= 14 sonder.tls.* tests, found $n" }

      - name: Test (full suite)
        run: ctest --preset ci-windows

      - name: TLS tests, repeated
        run: ctest --preset ci-windows -R "sonder\.tls\." --repeat until-fail:3
