name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # PRs share a group per branch (superseded runs cancel); each push to main
  # gets its own group so queued main runs are never replaced by a newer one.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: ci-linux
          - os: windows-latest
            preset: ci-windows
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ensure Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: CLI smoke (mock backend + telemetry)
        shell: bash
        run: |
          set -euo pipefail
          exe=build/${{ matrix.preset }}/sonder-infer
          "$exe" version
          "$exe" version --json
          "$exe" generate --backend mock --model mock:tiny --prompt "ci smoke" --max-tokens 8 --telemetry telemetry.jsonl
          test -s telemetry.jsonl
          # One-shot chat runs through Session::chat and emits request telemetry.
          "$exe" chat --backend mock --model mock:tiny --messages tests/fixtures/chat_messages.json --telemetry chat.jsonl
          grep -q '"event_type":"request.queued".*"attributes":{"kind":"chat"' chat.jsonl
          grep -q '"event_type":"request.completed"' chat.jsonl
          # Every telemetry line carries the Observatory envelope schema.
          for f in telemetry.jsonl chat.jsonl; do
            if grep -v -e '^{"schema":"sonder.observatory.event/1",' -e '^[[:space:]]*$' "$f"; then
              echo "$f: line without schema sonder.observatory.event/1" >&2
              exit 1
            fi
          done
          # Documented exit codes (docs/CLI.md): 2 for usage errors.
          rc=0; "$exe" generate --backend mock --model mock:tiny --prompt x --bogus 1 || rc=$?
          test "$rc" -eq 2
          rc=0; "$exe" || rc=$?
          test "$rc" -eq 2

      # Real synthetic HTTP/SSE clients, three fresh server lifecycles, and
      # SIGINT while admitted streams are still active. This is a blocking
      # step in the existing Linux context, not a model performance benchmark.
      - name: Mock HTTP/SSE lifecycle stress (Linux)
        id: mock-stress
        if: runner.os == 'Linux'
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/qualification
          python3 scripts/stress_mock.py \
            --binary build/${{ matrix.preset }}/sonder-infer --cycles 3 --mock-delay-ms 40 \
            --out build/qualification/mock-stress.json \
            2>&1 | tee build/qualification/mock-stress.log
          SONDER_STRESS_BINARY=build/${{ matrix.preset }}/sonder-infer SONDER_STRESS_DELAY_MS=40 \
            python3 -m unittest scripts.test_stress_mock \
            2>&1 | tee -a build/qualification/mock-stress.log

      - name: Retain mock lifecycle qualification receipt
        if: always() && runner.os == 'Linux' && steps.mock-stress.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: mock-lifecycle-stress-${{ matrix.preset }}
          path: |
            build/qualification/mock-stress.json
            build/qualification/mock-stress.log
          if-no-files-found: error
          retention-days: 14

  # Optional MSVC build of the llama.cpp backend (SONDER_WITH_LLAMA_CPP=ON).
  # Non-blocking for now: failures are reported but do not fail the workflow.
  # The pinned llama.cpp source tarball is cached and passed to FetchContent.
  llamacpp-windows:
    name: windows-latest (llama.cpp backend, optional)
    runs-on: windows-latest
    continue-on-error: true
    env:
      LLAMACPP_TAG: b11195
      LLAMACPP_SHA256: d9818b7786c8a3b063bac7eb7dc8710e275638f1e288e206720c9e22e7ca216a
    steps:
      - uses: actions/checkout@v7

      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ensure Ninja
        shell: pwsh
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }

      - name: Cache llama.cpp source
        id: llamacpp-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/llamacpp-src
          key: llamacpp-src-${{ env.LLAMACPP_TAG }}-${{ env.LLAMACPP_SHA256 }}

      - name: Download llama.cpp source (pinned, hash-checked)
        if: steps.llamacpp-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = Join-Path $env:RUNNER_TEMP 'llamacpp.tar.gz'
          $dst = Join-Path $env:RUNNER_TEMP 'llamacpp-src'
          Invoke-WebRequest -Uri "https://github.com/ggml-org/llama.cpp/archive/refs/tags/$env:LLAMACPP_TAG.tar.gz" -OutFile $tmp
          $hash = (Get-FileHash -Algorithm SHA256 $tmp).Hash.ToLower()
          if ($hash -ne $env:LLAMACPP_SHA256) { throw "llama.cpp tarball hash mismatch: $hash" }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          tar -xzf $tmp -C $dst --strip-components=1

      - name: Configure
        shell: pwsh
        run: |
          $src = (Join-Path $env:RUNNER_TEMP 'llamacpp-src') -replace '\\','/'
          cmake --preset ci-windows -DSONDER_WITH_LLAMA_CPP=ON -DGGML_NATIVE=OFF "-DFETCHCONTENT_SOURCE_DIR_LLAMACPP=$src"

      - name: Build
        run: cmake --build --preset ci-windows

      - name: Test
        run: ctest --preset ci-windows

  # TLS ON (SONDER_WITH_TLS=ON) with the system OpenSSL; runs tests/tls
  # (loopback server, test-time PKI). See docs/integration/tls.md.
  tls-linux:
    name: ubuntu-24.04 (TLS, OpenSSL)
    # Pinned image: its libssl-dev (OpenSSL 3.0.x) is the reviewed revision
    # recorded in docs/LICENSE_REVIEW.md.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja + OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev

      - name: Configure
        run: cmake --preset ci-linux -DSONDER_WITH_TLS=ON

      - name: Build
        run: cmake --build --preset ci-linux

      # A TLS lane that silently registers no TLS tests would still pass.
      - name: TLS tests are registered
        run: |
          n=$(ctest --preset ci-linux -N | grep -c 'sonder\.tls\.' || true)
          echo "sonder.tls.* tests: $n"
          test "$n" -ge 14

      - name: Test
        run: ctest --preset ci-linux

  # TLS ON with Schannel (required check).
  # OpenSSL is built only for the in-test server and PKI generation: from the
  # official openssl/openssl GitHub release tarball, pinned by SHA-256
  # (docs/LICENSE_REVIEW.md), and the install is cached under that hash. The
  # release assets are never deleted, so a vendor dropping old installers
  # (slproweb removed Win64OpenSSL-4_0_2.exe, which broke `choco install
  # openssl --version=4.0.2`) cannot break this job; a cache miss only costs
  # a rebuild. Bump OPENSSL_VERSION and OPENSSL_SHA256 together.
  tls-windows:
    name: windows-latest (TLS, Schannel)
    runs-on: windows-latest
    env:
      OPENSSL_VERSION: 4.0.3
      OPENSSL_SHA256: 325b5c806167c13b40b1ffeadfe0248197c00eccc4cf123ec1e28d2d2fd216d9
      OPENSSL_CONFIG: VC-WIN64A no-asm no-apps no-tests no-docs no-makedepend
      OPENSSL_PREFIX: C:\sonder-openssl
    steps:
      - uses: actions/checkout@v7

      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ensure Ninja
        shell: pwsh
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }

      - name: Cache OpenSSL (in-test TLS server only)
        id: openssl-cache
        uses: actions/cache@v6
        with:
          path: C:\sonder-openssl
          # Bump the trailing revision when OPENSSL_CONFIG or the prefix changes.
          key: openssl-${{ env.OPENSSL_VERSION }}-${{ env.OPENSSL_SHA256 }}-vc-win64a-r1

      - name: Build OpenSSL from the pinned source (in-test TLS server only)
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = Join-Path $env:RUNNER_TEMP "openssl-$env:OPENSSL_VERSION.tar.gz"
          Invoke-WebRequest -Uri "https://github.com/openssl/openssl/releases/download/openssl-$env:OPENSSL_VERSION/openssl-$env:OPENSSL_VERSION.tar.gz" -OutFile $tmp
          $hash = (Get-FileHash -Algorithm SHA256 $tmp).Hash.ToLower()
          if ($hash -ne $env:OPENSSL_SHA256) { throw "OpenSSL tarball hash mismatch: $hash" }
          tar -xzf $tmp -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "tar failed ($LASTEXITCODE)" }
          Set-Location (Join-Path $env:RUNNER_TEMP "openssl-$env:OPENSSL_VERSION")
          # OpenSSL needs a native Windows perl (the runner's Strawberry Perl),
          # not the MSYS perl that ships with Git.
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path $perl)) { $perl = (Get-Command perl.exe).Source }
          & $perl -v | Select-Object -First 2
          & $perl Configure @($env:OPENSSL_CONFIG -split ' ') "--prefix=$env:OPENSSL_PREFIX" "--openssldir=$env:OPENSSL_PREFIX\ssl"
          if ($LASTEXITCODE -ne 0) { throw "OpenSSL Configure failed ($LASTEXITCODE)" }
          nmake /nologo
          if ($LASTEXITCODE -ne 0) { throw "OpenSSL build failed ($LASTEXITCODE)" }
          nmake /nologo install_sw
          if ($LASTEXITCODE -ne 0) { throw "OpenSSL install failed ($LASTEXITCODE)" }

      # A stale or partial cache must not pass silently.
      - name: OpenSSL install is the pinned version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $h = Join-Path $env:OPENSSL_PREFIX 'include\openssl\opensslv.h'
          if (-not (Test-Path $h)) { throw "$h not found" }
          $v = Select-String -Path $h -Pattern '^#\s*define OPENSSL_VERSION_TEXT'
          Write-Host $v.Line
          if ($v.Line -notmatch [regex]::Escape("OpenSSL $env:OPENSSL_VERSION ")) { throw "expected OpenSSL $env:OPENSSL_VERSION" }
          foreach ($f in 'lib\libssl.lib', 'lib\libcrypto.lib') {
            if (-not (Test-Path (Join-Path $env:OPENSSL_PREFIX $f))) { throw "$f missing" }
          }
          $dlls = @(Get-ChildItem (Join-Path $env:OPENSSL_PREFIX 'bin') -Filter 'lib*.dll' | ForEach-Object Name)
          Write-Host "DLLs: $($dlls -join ', ')"
          if (-not ($dlls -match '^libssl-') -or -not ($dlls -match '^libcrypto-')) { throw 'OpenSSL DLLs missing' }
          # doctest discovery runs sonder_tls_tests.exe at build time, so the
          # DLLs must be on PATH for Build as well as Test (Chocolatey used to
          # put them on the machine PATH).
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:OPENSSL_PREFIX 'bin')

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:OPENSSL_PREFIX -replace '\\','/'
          cmake --preset ci-windows -DSONDER_WITH_TLS=ON "-DOPENSSL_ROOT_DIR=$root"
          if ($LASTEXITCODE -ne 0) { throw "configure failed ($LASTEXITCODE)" }
          # find_package(OpenSSL) must have picked the pinned build, not
          # another copy on the image.
          $cache = Get-Content 'build\ci-windows\CMakeCache.txt'
          $found = $cache | Select-String '^(OPENSSL_INCLUDE_DIR|LIB_EAY_RELEASE|SSL_EAY_RELEASE|OPENSSL_SSL_LIBRARY|OPENSSL_CRYPTO_LIBRARY)[:=]'
          $found | ForEach-Object { Write-Host $_.Line }
          if (@($found).Count -eq 0) { throw 'no OpenSSL entries in CMakeCache.txt' }
          foreach ($l in $found) {
            $p = ($l.Line -split '=', 2)[1]
            if ($p -and $p -notlike "$root*") { throw "OpenSSL resolved outside $root : $($l.Line)" }
          }

      - name: Build
        run: cmake --build --preset ci-windows

      # The Schannel build must not pull in OpenSSL (it is test-server only).
      - name: sonder-infer does not import OpenSSL
        shell: pwsh
        run: |
          $exe = 'build\ci-windows\sonder-infer.exe'
          if (-not (Test-Path $exe)) { throw "$exe not found" }
          $deps = dumpbin /dependents $exe | Out-String
          Write-Host $deps
          if ($deps -notmatch 'Image has the following dependencies') { throw 'dumpbin produced no dependency list' }
          if ($deps -match 'libssl|libcrypto') { throw 'sonder-infer.exe imports OpenSSL; the Schannel build must not' }

      # A TLS lane that silently registers no TLS tests would still pass.
      - name: TLS tests are registered
        shell: pwsh
        run: |
          $n = @(ctest --preset ci-windows -N | Select-String 'sonder\.tls\.').Count
          Write-Host "sonder.tls.* tests: $n"
          if ($n -lt 14) { throw "expected >= 14 sonder.tls.* tests, found $n" }

      - name: Test
        shell: pwsh
        run: ctest --preset ci-windows
