name: python

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Build the C ABI as a shared library once per OS. Only the sonder_inference
  # target is built: tests, the CLI and sonder-bench link C++ symbols that a
  # Windows DLL does not export.
  shared-lib:
    name: shared library (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lib: build-shared/libsonder_inference.so
            compilers: ""
          - os: windows-latest
            lib: build-shared/sonder_inference.dll
            compilers: -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ensure Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }

      # Default shell (bash on Linux, pwsh on Windows): Git Bash would put its
      # own link.exe ahead of MSVC's on PATH.
      - name: Configure (BUILD_SHARED_LIBS=ON)
        run: >
          cmake -S . -B build-shared -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=ON -DSONDER_BUILD_TESTS=OFF -DSONDER_BUILD_CLI=OFF
          ${{ matrix.compilers }}

      - name: Build sonder_inference
        run: cmake --build build-shared --target sonder_inference

      - uses: actions/upload-artifact@v4
        with:
          name: sonder-shared-${{ runner.os }}
          path: ${{ matrix.lib }}
          if-no-files-found: error
          retention-days: 3

  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    needs: shared-lib
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v4
        with:
          name: sonder-shared-${{ runner.os }}
          path: native

      - name: Install bindings (no compiler involved)
        run: python -m pip install "./bindings/python[test]"

      - name: Run pytest against the mock backend
        working-directory: bindings/python
        shell: bash
        env:
          SONDER_INFERENCE_LIB_DIR: ${{ github.workspace }}/native
        run: python -m pytest -v
