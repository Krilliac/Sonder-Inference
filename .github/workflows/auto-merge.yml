name: auto-merge

# Queues squash auto-merge on every ready pull request into main, so it merges
# once the required checks on main's branch protection pass. Stacked PRs (base
# other than main) are left alone: their base branch has no required checks,
# so auto-merge would merge them immediately, before any CI ran.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enable squash auto-merge
        env:
          # The merge GitHub performs for auto-merge is pushed as whoever
          # enabled it. Enabled with this workflow's GITHUB_TOKEN, that push
          # starts no workflows, so CI does not run on main after bot-enabled
          # merges. An owner token in the AUTO_MERGE_TOKEN secret (fine-grained
          # PAT or App token with Contents + Pull requests write on this
          # repository only) makes the merge an ordinary push that runs CI.
          # Without the secret this falls back to the old token, so auto-merge
          # itself never breaks.
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || github.token }}
        run: gh pr merge ${{ github.event.pull_request.number }} --auto --squash --repo ${{ github.repository }}
