[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sonder-inference"
version = "0.1.0"
description = "ctypes bindings for the Sonder Inference C ABI (no compiler needed at install time)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Nate Witkowski" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/Krilliac/Sonder-Inference"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sonder_inference = ["py.typed", "*.so", "*.dylib", "*.dll"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
